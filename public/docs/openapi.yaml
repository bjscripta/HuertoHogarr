openapi: 3.0.0
info:
  title: API Panel de Administración - Huerto Hogar
  description: API para gestión de productos, usuarios y compras
  version: 1.0.0
  contact:
    name: Soporte Huerto Hogar
    email: soporte@huertohogar.com

servers:
  - url: https://firestore.googleapis.com/v1
    description: Firebase Firestore API

tags:
  - name: Productos
    description: Gestión completa de productos (CRUD)
  - name: Usuarios
    description: Gestión de usuarios registrados
  - name: Compras
    description: Gestión de órdenes de compra

paths:
  # ==================== PRODUCTOS ====================
  /api/productos:
    get:
      tags:
        - Productos
      summary: Obtener todos los productos
      description: Obtiene la lista completa de productos disponibles
      responses:
        '200':
          description: Lista de productos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
              example:
                - id: "6MJVVRYOBmHyXEvVdUab"
                  nombre: "Naranjas Valencia"
                  precio: 1000
                  stock: 175
                  categoria: "Frutas frescas"
                  imagen: "https://huertohogar-15d5.web.app/assets/mg/productos/naranjasValencia.png"
                  descripcion: "Jugosas y ricas en vitamina C..."
                  unidad: "kilo"
                  activo: true

    post:
      tags:
        - Productos
      summary: Crear un nuevo producto
      description: Agrega un nuevo producto al inventario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              nombre: "Manzanas Fuji"
              precio: 1200
              stock: 200
              categoria: "Frutas frescas"
              imagen: "https://ejemplo.com/manzanas.jpg"
              descripcion: "Manzanas crujientes y dulces"
              unidad: "kilo"
      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID del producto creado
              example:
                id: "nuevoIdProducto123"
        '400':
          description: Datos inválidos
          content:
            application/json:
              example:
                error: "Datos incompletos"
                message: "Nombre, precio y stock son obligatorios"

  /api/productos/{id}:
    get:
      tags:
        - Productos
      summary: Obtener producto por ID
      description: Obtiene los detalles de un producto específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "6MJVVRYOBmHyXEvVdUab"
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              example:
                id: "6MJVVRYOBmHyXEvVdUab"
                nombre: "Naranjas Valencia"
                precio: 1000
                stock: 175
                categoria: "Frutas frescas"
                imagen: "https://huertohogar-15d5.web.app/assets/mg/productos/naranjasValencia.png"
                descripcion: "Jugosas y ricas en vitamina C..."
                unidad: "kilo"
                activo: true
        '404':
          description: Producto no encontrado
          content:
            application/json:
              example:
                error: "Producto no encontrado"
                message: "El producto con ID 6MJVVRYOBmHyXEvVdUab no existe"

    put:
      tags:
        - Productos
      summary: Actualizar producto existente
      description: Actualiza la información de un producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "6MJVVRYOBmHyXEvVdUab"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              nombre: "Naranjas Valencia Premium"
              precio: 1200
              stock: 150
              categoria: "Frutas frescas premium"
              descripcion: "Naranjas de la más alta calidad"
      responses:
        '200':
          description: Producto actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Producto actualizado correctamente"
        '404':
          description: Producto no encontrado

    delete:
      tags:
        - Productos
      summary: Eliminar producto del sistema
      description: Elimina un producto permanentemente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "6MJVVRYOBmHyXEvVdUab"
      responses:
        '200':
          description: Producto eliminado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Producto eliminado correctamente"
        '404':
          description: Producto no encontrado

  # ==================== USUARIOS ====================
  /api/usuarios:
    get:
      tags:
        - Usuarios
      summary: Obtener todos los usuarios
      description: Obtiene la lista de usuarios registrados
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
              example:
                - id: "user123"
                  nombre: "benj"
                  apellidos: "esteban"
                  correo: "benj@duoc.cl"
                  telefono: "+56986060719"
                  run: "12345678-9"
                  region: "Metropolitana"
                  comuna: "San Ramón"
                  direccion: "la badera 951"
                  uid: "firebaseUid123"
                  fecha: "2025-11-04T11:46:43Z"

  /api/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por ID
      description: Obtiene los detalles de un usuario específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: "user123"
                nombre: "benj"
                apellidos: "esteban"
                correo: "benj@duoc.cl"
                telefono: "+56986060719"
                run: "12345678-9"
                region: "Metropolitana"
                comuna: "San Ramón"
                direccion: "la badera 951"
                uid: "firebaseUid123"
                fecha: "2025-11-04T11:46:43Z"
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              example:
                error: "Usuario no encontrado"
                message: "El usuario con ID user123 no existe"

  # ==================== COMPRAS ====================
  /api/compras:
    get:
      tags:
        - Compras
      summary: Obtener todas las compras
      description: Obtiene la lista completa de órdenes de compra
      responses:
        '200':
          description: Lista de compras obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Compra'
              example:
                - id: "compra123"
                  numeroOrden: "HH1762256803873921"
                  fecha: "2025-11-04T11:46:43Z"
                  estado: "error_pego"
                  cliente:
                    nombre: "benj"
                    apellidos: "esteban"
                    correo: "benj@duoc.cl"
                    telefono: "+56986060719"
                    direccion:
                      calle: "la badera"
                      comuna: "San Ramón"
                      departamento: "951"
                      region: "Metropolitana"
                      indicaciones: ""
                  productos:
                    - id: "6MJVVRYOBmHyXEvVdUab"
                      nombre: "Naranjas Valencia"
                      cantidad: 1
                      precio: 1000
                      categoria: "Frutas Frescas"
                      descripcion: "Jugosas y ricas en vitamina C..."
                      imagen: "https://huertohogar-15d5.web.app/assets/mg/productos/naranjasValencia.png"

  /api/compras/{id}:
    get:
      tags:
        - Compras
      summary: Obtener compra por ID
      description: Obtiene los detalles de una compra específica
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "compra123"
      responses:
        '200':
          description: Compra encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compra'
              example:
                id: "compra123"
                numeroOrden: "HH1762256803873921"
                fecha: "2025-11-04T11:46:43Z"
                estado: "error_pego"
                cliente:
                  nombre: "benj"
                  apellidos: "esteban"
                  correo: "benj@duoc.cl"
                  telefono: "+56986060719"
                  direccion:
                    calle: "la badera"
                    comuna: "San Ramón"
                    departamento: "951"
                    region: "Metropolitana"
                    indicaciones: ""
                productos:
                  - id: "6MJVVRYOBmHyXEvVdUab"
                    nombre: "Naranjas Valencia"
                    cantidad: 1
                    precio: 1000
                    categoria: "Frutas Frescas"
                    descripcion: "Jugosas y ricas en vitamina C..."
                    imagen: "https://huertohogar-15d5.web.app/assets/mg/productos/naranjasValencia.png"
        '404':
          description: Compra no encontrada

  /api/compras/{id}/estado:
    put:
      tags:
        - Compras
      summary: Actualizar estado de compra
      description: 
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "compra123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  description: Nuevo estado de la compra
            example:
              estado: "completado"
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Estado actualizado a completado"
        '404':
          description: Compra no encontrada

components:
  schemas:
    Producto:
      type: object
      properties:
        id:
          type: string
          description: ID único del producto
        nombre:
          type: string
          example: "Naranjas Valencia"
        precio:
          type: number
          example: 1000
        stock:
          type: integer
          example: 175
        categoria:
          type: string
          example: "Frutas frescas"
        imagen:
          type: string
          example: "https://huertohogar-15d5.web.app/assets/mg/productos/naranjasValencia.png"
        descripcion:
          type: string
          example: "Jugosas y ricas en vitamina C..."
        unidad:
          type: string
          example: "kilo"
        activo:
          type: boolean
          example: true

    ProductoInput:
      type: object
      required:
        - nombre
        - precio
        - stock
      properties:
        nombre:
          type: string
          description: Nombre del producto
        precio:
          type: number
          description: Precio del producto
        stock:
          type: integer
          description: Cantidad en stock
        categoria:
          type: string
          description: Categoría del producto
        imagen:
          type: string
          description: URL de la imagen
        descripcion:
          type: string
          description: Descripción detallada
        unidad:
          type: string
          description: Unidad de medida (kilo, unidad, etc.)

    Usuario:
      type: object
      properties:
        id:
          type: string
          description: ID único del usuario
        nombre:
          type: string
          example: "benj"
        apellidos:
          type: string
          example: "esteban"
        correo:
          type: string
          format: email
          example: "benj@duoc.cl"
        telefono:
          type: string
          example: "+56986060719"
        run:
          type: string
          example: "12345678-9"
        region:
          type: string
          example: "Metropolitana"
        comuna:
          type: string
          example: "San Ramón"
        direccion:
          type: string
          example: "la badera 951"
        uid:
          type: string
          description: Firebase UID
        fecha:
          type: string
          format: date-time
          description: Fecha de registro

    Compra:
      type: object
      properties:
        id:
          type: string
          description: ID único de la compra
        numeroOrden:
          type: string
          example: "HH1762256803873921"
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          example: "error_pego"
        cliente:
          type: object
          properties:
            nombre:
              type: string
            apellidos:
              type: string
            correo:
              type: string
              format: email
            telefono:
              type: string
            direccion:
              type: object
              properties:
                calle:
                  type: string
                comuna:
                  type: string
                departamento:
                  type: string
                region:
                  type: string
                indicaciones:
                  type: string
        productos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              nombre:
                type: string
              cantidad:
                type: integer
              precio:
                type: number
              categoria:
                type: string
              descripcion:
                type: string
              imagen:
                type: string